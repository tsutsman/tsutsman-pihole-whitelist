name: Final merged branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[final-branch-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged fix branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch='fix/service-files-handling'
          if gh api "repos/$REPO/branches/$branch" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Deleted: $branch"
          else
            echo "Already absent: $branch"
          fi
