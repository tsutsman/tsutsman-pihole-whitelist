name: One-time stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale agent branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name'
          )
          mapfile -t open_pr_heads < <(
            gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref'
          )

          is_open_pr_head() {
            local branch="$1"
            local head
            for head in "${open_pr_heads[@]}"; do
              [[ "$head" == "$branch" ]] && return 0
            done
            return 1
          }

          deleted=0
          skipped=0
          for branch in "${branches[@]}"; do
            case "$branch" in
              main)
                continue
                ;;
              codex/*|codex-*|*-codex|*-codex/*|fix/stats-last-review-determinism)
                ;;
              *)
                continue
                ;;
            esac

            if is_open_pr_head "$branch"; then
              echo "SKIP open PR: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            echo "DELETE: $branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            deleted=$((deleted + 1))
          done

          echo "Deleted branches: $deleted"
          echo "Skipped open-PR branches: $skipped"
