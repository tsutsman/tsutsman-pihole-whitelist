name: One-shot deterministic stats fix

on:
  push:
    branches:
      - codex/audit-whitelist-2026-08-27
    paths:
      - '.github/workflows/one_shot_stats_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/audit-whitelist-2026-08-27
          fetch-depth: 0

      - name: Make category timestamps deterministic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('generate_stats_report.sh')
          text = path.read_text(encoding='utf-8')
          old = '''  last_check='невідомо'
  if [[ -f "$file" ]]; then
    last_check=$(date -r "$file" '+%F %T' 2>/dev/null || echo 'невідомо')
  fi
'''
          new = '''  last_check='невідомо'
  if git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
    last_check=$(git log -1 --format='%ci' -- "$file" 2>/dev/null || true)
  elif [[ -f "$file" ]]; then
    last_check=$(date -r "$file" '+%F %T' 2>/dev/null || echo 'невідомо')
  fi
  [[ -n "$last_check" ]] || last_check='невідомо'
'''
          if old not in text:
              raise SystemExit('last_check block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '* Дати визначаються за часом останньої модифікації файлу категорії.\\n\\n',
              '* Для tracked-файлів дата визначається за останнім Git-комітом; для untracked-файлів використовується filesystem mtime.\\n\\n',
              1,
          )
          text = text.replace(
              '* Dates are based on the category file modification time.\\n\\n',
              '* Tracked files use the last Git commit time; untracked files fall back to filesystem mtime.\\n\\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate deterministic reports
        shell: bash
        run: |
          chmod +x ./generate_stats_report.sh
          REPORT_TIMESTAMP_MODE=keep \
          DASHBOARD_TIMESTAMP_MODE=keep \
          REPORT_FOOTER_TIMESTAMP_MODE=keep \
          HISTORY_TIMESTAMP_MODE=keep \
          ./generate_stats_report.sh

      - name: Commit fix and reports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generate_stats_report.sh docs/data_stats.md docs/data_stats.en.md docs/dashboard.html docs/data_history.json
          git commit -m 'fix: make stats report timestamps deterministic'
          git push origin HEAD:codex/audit-whitelist-2026-08-27
