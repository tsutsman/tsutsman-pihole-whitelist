name: Перевірка дублювань

on:
  pull_request:
    paths:
      - '**.txt'
      - 'check_duplicates.sh'
      - 'generate_whitelist.sh'
      - '.github/workflows/duplicate_check.yml'

permissions:
  contents: read

jobs:
  duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Виконати blocking-перевірку дублікатів
        run: |
          chmod +x ./check_duplicates.sh
          SKIP_DNS_CHECK=1 ./check_duplicates.sh
      - name: Перевірити актуальність whitelist-артефактів
        run: |
          chmod +x ./generate_whitelist.sh
          ./generate_whitelist.sh
          ./generate_whitelist.sh --exact-only -o whitelist-exact.txt
          if ! git diff --quiet --exit-code whitelist.txt whitelist-exact.txt; then
            echo 'whitelist-артефакти не актуальні, запустіть generate_whitelist.sh' >&2
            exit 1
          fi
