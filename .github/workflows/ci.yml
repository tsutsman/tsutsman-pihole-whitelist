name: ci

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Встановити залежності
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Одноразово застосувати stats hotfix
        if: github.event_name == 'push' && github.ref_name == 'codex/fix-stats-last-review'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_stats_last_review.py
          REPORT_TIMESTAMP_MODE=keep \
          DASHBOARD_TIMESTAMP_MODE=keep \
          REPORT_FOOTER_TIMESTAMP_MODE=keep \
          HISTORY_TIMESTAMP_MODE=keep \
          ./generate_stats_report.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generate_stats_report.sh docs/data_stats.md docs/data_stats.en.md docs/dashboard.html docs/data_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: derive stats review dates from category metadata'
            git push origin HEAD:codex/fix-stats-last-review
          fi

      - name: Запустити тестові сценарії
        shell: bash
        env:
          COMMENT_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          chmod +x tests/*.sh
          for script in tests/*_test.sh; do
            echo "::group::${script}"
            bash "$script"
            echo "::endgroup::"
          done

      - name: Перевірити актуальність статистичних звітів
        shell: bash
        run: |
          set -euo pipefail
          REPORT_TIMESTAMP_MODE=keep \
          DASHBOARD_TIMESTAMP_MODE=keep \
          REPORT_FOOTER_TIMESTAMP_MODE=keep \
          HISTORY_TIMESTAMP_MODE=keep \
          ./generate_stats_report.sh
          git diff --exit-code docs/data_stats.md docs/data_stats.en.md docs/dashboard.html docs/data_history.json
